[package]
name = "cargo-verify"
version = "0.1.0"
edition = "2024"

[[test]]
name = "end-to-end"
harness = false

[dependencies]
charon = { path = "../charon/charon" }
charon-bin-interface = { path = "../charon-bin-interface" }
charon-driver-bin-interface = { path = "../charon-driver-bin-interface" }
proc-macro-crate = { path = "../proc-macro-crate" }
utils = { path = "../utils" }

anyhow = "1.0.81"
bumpalo = "3.20.2"
clap = { version = "4.5.50", features = ["derive"] }
clap-cargo = "0.19.0"
include_dir = "0.7.4"
itertools = "0.15.0"
malachite = { version = "0.11.0", default-features = false, features = ["naturals_and_integers", "std"] }
ocaml-format = "0.1.1"
rustc_apfloat = "0.2.3"
serde_json = "1.0.151"
tempfile = "3.27.0"
why3-ptree = "0.3.0"
yansi = { version = "1.0.1", features = ["detect-tty", "detect-env"] }

[dev-dependencies]
libtest-mimic = "0.8.2"
similar-asserts = "2.0.0"
which = "8.0.6"
