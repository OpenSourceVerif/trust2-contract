<aside class="annotation-panel" id="annotation-panel" aria-label="阅读批注" hidden>
  <div class="annotation-heading"><div><span class="annotation-kicker">READING NOTES</span><h2>阅读批注 <span id="annotation-count">0</span></h2></div><button type="button" id="annotation-close" aria-label="收起批注">×</button></div>
  <div class="annotation-identity"><span id="annotation-author">尚未设置作者</span><button type="button" id="annotation-profile">设置</button></div>
  <div class="annotation-filters" role="group" aria-label="显示谁的批注"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="mine" aria-pressed="false">我的</button><button type="button" data-filter="others" aria-pressed="false">他人</button></div>
  <form id="annotation-editor" hidden>
    <div class="annotation-editor-title"><strong id="annotation-editor-title">添加批注</strong><button type="button" id="annotation-cancel">取消</button></div>
    <blockquote id="annotation-quote"></blockquote>
    <label for="annotation-note">笔记 <span>选填，留空仅高亮</span></label>
    <textarea id="annotation-note" rows="5" maxlength="20000" placeholder="记下疑问、理解，或需要继续查证的地方…"></textarea>
    <button class="annotation-save" type="submit">保存批注</button>
  </form>
  <div class="annotation-list" id="annotation-list"></div>
  <details class="annotation-sync"><summary>同步与备份</summary><p>批注先保存在此浏览器。导出我的批注，再纳入仓库，通过 GitHub 共享。</p><div><button type="button" id="annotation-export">导出我的批注</button><button type="button" id="annotation-import">导入批注</button></div><input id="annotation-file" type="file" accept="application/json,.json" hidden><p>将导出的文件交给仓库中的 <code>annotations.py</code> 导入并构建。拉取仓库、重新构建后刷新，即可看到他人的批注。</p><p id="annotation-sync-state"></p></details>
</aside>
<div id="annotation-selection" class="annotation-selection" role="toolbar" aria-label="选文操作" hidden><button type="button" id="annotation-highlight">高亮</button><button type="button" id="annotation-comment">添加批注</button></div>
<div class="annotation-notice" id="annotation-notice" role="status" hidden><span></span><button type="button" hidden>撤销</button></div>
<dialog id="annotation-profile-dialog" class="annotation-profile-dialog" aria-labelledby="annotation-profile-title"><form id="annotation-profile-form"><h2 id="annotation-profile-title">你的批注署名</h2><p>使用 GitHub 用户名，在不同设备上保持一致，用于区分“我的”和“他人”。这是本地署名，不会登录 GitHub。</p><label for="annotation-username">GitHub 用户名</label><input id="annotation-username" autocomplete="username" maxlength="39" required pattern="[a-zA-Z0-9][a-zA-Z0-9-]{0,38}" placeholder="例如 your-name"><p id="annotation-profile-error" role="alert"></p><div><button type="button" id="annotation-profile-cancel">取消</button><button type="submit">保存署名</button></div></form></dialog>
