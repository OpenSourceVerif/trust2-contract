name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env: 
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        VM:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-latest

    runs-on: ${{ matrix.VM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"
          opam-pin: false

      - parallel:
        - name: Set up Rust toolchain
          uses: actions-rust-lang/setup-rust-toolchain@v1
          with:
            rustflags: ""

        - name: Install Why3find
          run: opam install . --deps-only --yes

      - name: Run tests
        run: opam exec -- cargo test --all-features --verbose
